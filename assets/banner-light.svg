<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="oh-my-tutor — hints before solutions, learning that remembers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4EFE2"/>
      <stop offset="1" stop-color="#E9E1CB"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="38%" r="60%">
      <stop offset="0" stop-color="#C97F1F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C97F1F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#12182B"/>
    </pattern>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C97F1F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C97F1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect width="1280" height="400" fill="url(#dots)" opacity="0.05"/>

  <!-- track rail: learning tracks, resumed over time -->
  <g>
    <line x1="120" y1="316" x2="660" y2="316" stroke="#C9C0AC" stroke-width="2" stroke-linecap="round"/>
    <line x1="660" y1="316" x2="1160" y2="316" stroke="#C9C0AC" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 10"/>

    <circle cx="120" cy="316" r="5" fill="#C9C0AC"/>
    <circle cx="305" cy="316" r="5" fill="#C9C0AC"/>
    <circle cx="480" cy="316" r="5" fill="#C9C0AC"/>

    <circle cx="660" cy="316" r="15" fill="url(#nodeGlow)"/>
    <circle cx="660" cy="316" r="7.5" fill="#C97F1F"/>
    <circle cx="660" cy="316" r="12" fill="none" stroke="#C97F1F" stroke-width="1.5" opacity="0.6"/>

    <circle cx="845" cy="316" r="5" fill="none" stroke="#C9C0AC" stroke-width="1.5"/>
    <circle cx="1015" cy="316" r="5" fill="none" stroke="#C9C0AC" stroke-width="1.5"/>
    <circle cx="1160" cy="316" r="5" fill="none" stroke="#C9C0AC" stroke-width="1.5"/>
  </g>

  <!-- owl mascot, perched on the accent line -->
  <g fill="none" stroke="#12182B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M132 130 L150 80 L184 112 Q208 104 232 112 L266 80 L284 130 Q298 176 284 222 Q268 280 208 284 Q148 280 132 222 Q118 176 132 130 Z"/>
    <circle cx="172" cy="162" r="28"/>
    <circle cx="244" cy="162" r="28"/>
    <path d="M190 236 L198 246 L206 236 M210 236 L218 246 L226 236" stroke-width="4"/>
  </g>
  <circle cx="176" cy="164" r="10" fill="#C97F1F"/>
  <circle cx="248" cy="164" r="10" fill="#C97F1F"/>
  <path d="M200 192 L216 192 L208 208 Z" fill="#C97F1F"/>
  <path d="M190 284 L186 292 M196 284 L196 292 M220 284 L220 292 M226 284 L230 292" stroke="#C97F1F" stroke-width="4" stroke-linecap="round"/>
  <line x1="92" y1="292" x2="330" y2="292" stroke="#C97F1F" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- wordmark -->
  <text x="424" y="196" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="66" font-weight="600" fill="#12182B" letter-spacing="0.5">oh-my-<tspan fill="#C97F1F">tutor</tspan></text>

  <!-- tagline -->
  <text x="426" y="234" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="18" letter-spacing="2.5" fill="#8A7F68">HINTS BEFORE SOLUTIONS &#183; LEARNING THAT REMEMBERS</text>

  <!-- footer -->
  <text x="1160" y="368" text-anchor="end" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="16" fill="#C9C0AC">pi install npm:oh-my-tutor &#183; /plugin install tutor@oh-my-tutor</text>
</svg>
